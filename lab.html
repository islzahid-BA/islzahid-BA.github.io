  <h1>You’re the analyst now.</h1>
  <p class="lab-lead">A business problem. A few clues. Your next move.<br>Pick an experiment, follow the evidence, and see where it takes you.</p>

    <span class="pick-meta">~3 min</span>
  </button>
  <button class="lab-pick" role="tab" data-game="bottleneck">
    <span class="pick-no">02</span>
    <span class="pick-title">Bottleneck Factory</span>
    <span class="pick-desc">Staff a production line, run the shift, then spend one upgrade where it actually matters.</span>
    <span class="pick-meta">~2 min</span>
  </button>
  <button class="lab-pick" role="tab" data-game="calibration">
    <span class="pick-no">03</span>
    <span class="pick-title">Calibration Challenge</span>
    <span class="pick-desc">How well do you know what you don’t know? Ten questions, 90% confidence ranges.</span>
    <span class="pick-meta">~2 min</span>
  </button>
</section>
