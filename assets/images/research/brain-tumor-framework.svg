<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 860" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Explainable brain tumor decision-support framework</title>
<desc id="d">Brain MRI scans pass through a shared VGG16 encoder into three branches: a U-Net decoder producing a segmentation mask, a classifier head producing a tumor label, and XAI inputs (FastSHAP, Guided Backpropagation, Occlusion Sensitivity) feeding the novel ShapDensity overlay. A constrained LLM summarizes these structured outputs into a structured clinical report for decision support only.</desc>
