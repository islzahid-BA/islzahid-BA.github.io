<text x="143.0" y="265.0" font-size="21" font-weight="700" fill="#1f2a33" text-anchor="middle">Audit pipeline</text>
<rect x="48" y="292" width="290" height="344" rx="12" fill="#ffffff" stroke="#8c9aa3" stroke-width="1.4"/>
<text x="318" y="322" font-size="12" font-weight="700" fill="#7a8790" text-anchor="end">STEP 1</text>
<path d="M6 2h16l8 8v24H6z M22 2v8h8 M11 16h14 M11 22h14 M11 28h10" fill="none" stroke="#2f4858" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(70 310)"/>
<text x="70" y="384" font-size="21" font-weight="700" fill="#1f2a33" text-anchor="start">Claim extraction</text>
<text x="70" y="416" font-size="16.5" font-weight="400" fill="#3c4a55" text-anchor="start">Split Brief Hospital Course</text>
<text x="70" y="438" font-size="16.5" font-weight="400" fill="#3c4a55" text-anchor="start">text into atomic medication</text>
<text x="70" y="460" font-size="16.5" font-weight="400" fill="#3c4a55" text-anchor="start">and treatment claims</text>
