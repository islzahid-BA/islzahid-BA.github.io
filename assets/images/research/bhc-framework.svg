<text x="1033" y="384" font-size="21" font-weight="700" fill="#1d3557" text-anchor="start">Claim verification</text>
<text x="1033" y="416" font-size="16.5" font-weight="400" fill="#3c4a55" text-anchor="start">Assess whether each claim</text>
<text x="1033" y="438" font-size="16.5" font-weight="400" fill="#3c4a55" text-anchor="start">is supported by the</text>
<text x="1033" y="460" font-size="16.5" font-weight="400" fill="#3c4a55" text-anchor="start">retrieved evidence</text>
<path d="M1033 488H1279" stroke="#c9d1d6" stroke-width="1.2"/>
<text x="1033" y="512" font-size="14" font-weight="700" fill="#55636d" text-anchor="start" font-style="italic">Methods</text>
<text x="1033" y="535" font-size="15.5" font-weight="400" fill="#3c4a55" text-anchor="start">rule-based matching,</text>
<text x="1033" y="556" font-size="15.5" font-weight="400" fill="#3c4a55" text-anchor="start">reranking / cross-encoder,</text>
<text x="1033" y="577" font-size="15.5" font-weight="400" fill="#3c4a55" text-anchor="start">LLM-assisted verification</text>
