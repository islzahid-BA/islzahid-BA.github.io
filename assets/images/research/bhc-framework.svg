<path d="M920 64v72" stroke="#7d9cbc" stroke-width="1.5"/>
<text x="942" y="88" font-size="25" font-weight="700" fill="#1f2a33" text-anchor="start">MIMIC-IV / MIMIC-IV-Note</text>
<text x="942" y="116" font-size="18" font-weight="400" fill="#1f2a33" text-anchor="start">Discharge notes and structured hospital records</text>
<text x="942" y="140" font-size="15" font-weight="400" fill="#3c4a55" text-anchor="start">medication administration, prescriptions, laboratory events, microbiology, procedures</text>
