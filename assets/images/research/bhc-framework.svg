<text x="70" y="512" font-size="14" font-weight="700" fill="#55636d" text-anchor="start" font-style="italic">Methods</text>
<text x="70" y="535" font-size="15.5" font-weight="400" fill="#3c4a55" text-anchor="start">clinical NLP, local</text>
<text x="70" y="556" font-size="15.5" font-weight="400" fill="#3c4a55" text-anchor="start">open-weight LLMs</text>
