<text x="391" y="384" font-size="21" font-weight="700" fill="#1f2a33" text-anchor="start">Clinical normalization</text>
<text x="391" y="416" font-size="16.5" font-weight="400" fill="#3c4a55" text-anchor="start">Standardize medication,</text>
<text x="391" y="438" font-size="16.5" font-weight="400" fill="#3c4a55" text-anchor="start">route, dose, action,</text>
<text x="391" y="460" font-size="16.5" font-weight="400" fill="#3c4a55" text-anchor="start">and timing</text>
<path d="M391 488H637" stroke="#c9d1d6" stroke-width="1.2"/>
<text x="391" y="512" font-size="14" font-weight="700" fill="#55636d" text-anchor="start" font-style="italic">Methods</text>
<text x="391" y="535" font-size="15.5" font-weight="400" fill="#3c4a55" text-anchor="start">terminology normalization,</text>
<text x="391" y="556" font-size="15.5" font-weight="400" fill="#3c4a55" text-anchor="start">rule-based parsing</text>
<path d="M662 464.0H686" fill="none" stroke="#33414c" stroke-width="2" marker-end="url(#ah)"/>
