<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1000" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Structured-evidence auditing framework for Brief Hospital Course documentation</title>
<desc id="d">Discharge Me! and MIMIC-IV feed a five-step audit pipeline: claim extraction, clinical normalization, evidence retrieval, claim verification, and clinician validation. Each claim is assigned an evidence status (supported, contradicted, insufficient evidence, not verifiable), leading to three research outputs.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#33414c"/></marker></defs>
