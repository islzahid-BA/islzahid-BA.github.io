<text x="1156.0" y="603" font-size="13.5" font-weight="400" fill="#2d5487" text-anchor="middle" font-style="italic">retrieval-augmented verification</text>
<text x="1156.0" y="620" font-size="13.5" font-weight="400" fill="#2d5487" text-anchor="middle" font-style="italic">(not a generative RAG pipeline)</text>
