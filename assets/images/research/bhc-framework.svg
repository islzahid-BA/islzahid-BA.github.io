<text x="712" y="416" font-size="16.5" font-weight="400" fill="#3c4a55" text-anchor="start">Retrieve candidate</text>
<text x="712" y="438" font-size="16.5" font-weight="400" fill="#3c4a55" text-anchor="start">structured evidence from</text>
<text x="712" y="460" font-size="16.5" font-weight="400" fill="#3c4a55" text-anchor="start">the same hospitalization</text>
<path d="M712 488H958" stroke="#c9d1d6" stroke-width="1.2"/>
<text x="712" y="512" font-size="14" font-weight="700" fill="#55636d" text-anchor="start" font-style="italic">Methods</text>
<text x="712" y="535" font-size="15.5" font-weight="400" fill="#3c4a55" text-anchor="start">structured joins, rule-based</text>
<text x="712" y="556" font-size="15.5" font-weight="400" fill="#3c4a55" text-anchor="start">search, embedding retrieval</text>
<path d="M983 464.0H1007" fill="none" stroke="#33414c" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1011" y="292" width="290" height="344" rx="12" fill="#e6eff9" stroke="#4a72a8" stroke-width="2"/>
<text x="1281" y="322" font-size="12" font-weight="700" fill="#7a8790" text-anchor="end">STEP 4</text>
