<text x="1354" y="416" font-size="16.5" font-weight="400" fill="#3c4a55" text-anchor="start">Review a stratified sample</text>
<text x="1354" y="438" font-size="16.5" font-weight="400" fill="#3c4a55" text-anchor="start">to assess accuracy and</text>
<text x="1354" y="460" font-size="16.5" font-weight="400" fill="#3c4a55" text-anchor="start">inter-rater agreement</text>
<path d="M1354 488H1600" stroke="#c9d1d6" stroke-width="1.2"/>
<text x="1354" y="512" font-size="14" font-weight="700" fill="#55636d" text-anchor="start" font-style="italic">Methods</text>
<text x="1354" y="535" font-size="15.5" font-weight="400" fill="#3c4a55" text-anchor="start">expert annotation</text>
<text x="1354" y="556" font-size="15.5" font-weight="400" fill="#3c4a55" text-anchor="start">and adjudication</text>
